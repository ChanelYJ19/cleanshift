[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cleanshift"
version = "0.1.0"
description = "Delay batch ML/AI jobs to the cleanest grid window"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
cleanshift = "cleanshift._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cleanshift"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
